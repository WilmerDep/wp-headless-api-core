name: Validate and Build

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-build:
    name: PHP validation and plugin package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show PHP version
        run: php -v

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Run isolated News SEO fallback test
        run: php tests/news-seo-fallback.php

      - name: Run News timezone and author regression test
        run: php tests/news-datetime-timezone.php

      - name: Run News public visibility regression test
        run: php tests/news-public-visibility.php

      - name: Run News revalidation HMAC signature test
        run: php tests/news-revalidation-signature.php

      - name: Run News lifecycle hook registration test
        run: php tests/news-revalidation-hooks.php

      - name: Run News editorial lifecycle revalidation test
        run: php tests/news-revalidation-lifecycle.php

      - name: Run Hero sanitization regression test
        run: php tests/hero-sanitization.php

      - name: Run Hero serializer regression test
        run: php tests/hero-serializer.php

      - name: Run Hero controller and freshness regression test
        run: php tests/hero-controller.php

      - name: Run Hero lifecycle hook registration test
        run: php tests/hero-revalidation-hooks.php

      - name: Run Hero editorial lifecycle revalidation test
        run: php tests/hero-revalidation-lifecycle.php

      - name: Run Directory sanitization regression test
        run: php tests/directory-sanitization.php

      - name: Run Directory lifecycle hook registration test
        run: php tests/directory-revalidation-hooks.php

      - name: Resolve plugin version
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' wp-headless-api-core.php | head -n 1 | tr -d '\r')"
          if [[ -z "$version" ]]; then
            echo "Could not resolve plugin version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build WordPress plugin ZIP
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/wp-headless-api-core
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='tests' \
            ./ build/wp-headless-api-core/
          cd build
          zip -rq "wp-headless-api-core-v${PLUGIN_VERSION}.zip" wp-headless-api-core

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wp-headless-api-core-v${{ steps.plugin.outputs.version }}
          path: build/wp-headless-api-core-v${{ steps.plugin.outputs.version }}.zip
          if-no-files-found: error
